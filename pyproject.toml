[project]
name = "plane-agent"
version = "0.3.0"
description = "Coordinate an orchestrator and its AI subagents through a Plane tracker (Plane Cloud or self-hosted)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "apexJCL" }]
keywords = ["plane", "project-management", "ai-agents", "claude-code", "orchestration"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Bug Tracking",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "markdown-it-py>=3,<5",
]

[project.urls]
Homepage = "https://github.com/apexJCL/plane-agent"
Issues = "https://github.com/apexJCL/plane-agent/issues"

[project.scripts]
plane-agent = "plane_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
